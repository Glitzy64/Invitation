<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Surprise 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe0ef, #ffc2df, #fff0f7);
      color: #a52c67;
    }

    .card {
      width: min(88%, 370px);
      padding: 32px 24px;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #ffb2d3;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(190, 63, 120, 0.18);
      z-index: 2;
    }

    .heart {
      font-size: 54px;
      margin-bottom: 8px;
      animation: heartbeat 1.2s infinite;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    p {
      line-height: 1.5;
      color: #94506f;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 2px solid #ffc0dc;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #e75498;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: none;
      border-radius: 12px;
      background: #e75498;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #message {
      min-height: 24px;
      font-size: 14px;
      color: #c02e72;
    }

    .emoji {
      position: fixed;
      top: -40px;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 1;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    @keyframes heartbeat {
      50% {
        transform: scale(1.12);
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="heart">💗</div>
    <h1>A Little Surprise</h1>
    <p>There's something waiting for you, Liyag. 🎀</p>

    <form id="passwordForm">
      <input
        id="password"
        type="password"
        placeholder="Enter the secret password"
        autocomplete="off"
        required
      >
      <button type="submit">Unlock My Surprise 💌</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const form = document.getElementById("passwordForm");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (passwordInput.value === "lox") {
        message.textContent = "Opening your surprise... 💗";
        window.location.href = "book.html";
      } else {
        message.textContent = "Oops! That's not the password. Try again. 🥺";
        passwordInput.value = "";
        passwordInput.focus();
      }
    });

    const emojis = ["💗", "💕", "🎀", "💖", "🌸"];

    function createFallingEmoji() {
      const emoji = document.createElement("span");
      emoji.className = "emoji";
      emoji.textContent = emojis[
        Math.floor(Math.random() * emojis.length)
      ];

      emoji.style.left = Math.random() * 100 + "vw";
      emoji.style.fontSize = 16 + Math.random() * 18 + "px";
      emoji.style.animationDuration = 4 + Math.random() * 5 + "s";

      document.body.appendChild(emoji);

      setTimeout(() => emoji.remove(), 9000);
    }

    setInterval(createFallingEmoji, 450);
  </script>
</body>
</html>
