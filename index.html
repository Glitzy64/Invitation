
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Invitation 💗</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffe4ef, #f5a9ca);
      font-family: Georgia, serif;
      color: #a43c6d;
      padding: 20px;
    }

    .security {
      width: min(100%, 360px);
      padding: 32px 24px;
      text-align: center;
      background: #fff8fb;
      border: 2px solid #f6b8d1;
      border-radius: 24px;
      box-shadow: 0 12px 35px #b64b7b30;
    }

    .heart { font-size: 48px; }

    h1 { font-size: 27px; }

    p { line-height: 1.6; }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 12px;
      font-size: 16px;
    }

    input {
      border: 1px solid #e9a1bf;
      background: white;
      color: #8f315e;
    }

    button {
      border: none;
      background: #e879a9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #error {
      color: #bd245b;
      min-height: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="security">
    <div class="heart">🎀</div>
    <h1>A little surprise for you</h1>
    <p>Enter the secret password to open your invitation. 💌</p>

    <form id="loginForm">
      <input
        id="password"
        type="password"
        placeholder="Enter the secret password"
        autocomplete="off"
        required
      >
      <button type="submit">Unlock my surprise 💗</button>
      <p id="error" role="alert"></p>
    </form>
  </main>

  <script>
    // Change this to your chosen password.
    const secretPassword = "alviso";

    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const entered = document.getElementById("password").value;

      if (entered === secretPassword) {
        window.location.href = "book.html";
      } else {
        document.getElementById("error").textContent =
          "Oops! That's not the right password. Try again 💕";
      }
    });
  </script>
</body>
</html>
