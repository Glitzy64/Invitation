
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Surprise 💌</title>
  <link rel="stylesheet" href="security.css">
  <script src="security.js" defer></script>
</head>
<body>
  <main class="security-card">
    <div class="bow">🎀</div>

    <p class="eyebrow">A little surprise for</p>
    <h1>My Liyag 💗</h1>

    <p class="description">
      Enter the secret password to open your invitation.
    </p>

    <form id="passwordForm">
      <label for="password">Secret password</label>

      <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter password"
        autocomplete="off"
        required
      >

      <button type="submit">Unlock my surprise ✨</button>

      <p id="errorMessage" class="error" role="status"></p>
    </form>

    <p class="small-note">Made with love by Carlo 💌</p>
  </main>
</body>
</html>
